[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
gas_reports = ["*"]

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"
anvil_local = "http://127.0.0.1:8545"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://testnet.monadscan.com/api" }
monad_mainnet = { key = "${MONADSCAN_API_KEY}", url = "https://monadscan.com/api" }

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 64
fail_on_revert = true
