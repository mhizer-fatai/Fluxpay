# Render Blueprint — deploys the FluxPay backend (Express API + WebSocket gateway).
# Usage: Render dashboard → New → Blueprint → pick this repo → fill in the secret
# env vars when prompted (values live in backend/.env for local development).
services:
  - type: web
    name: fluxpay-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Public config with sane defaults is baked into the code; only secrets and
      # environment-specific values are set here.
      - key: CORS_ORIGINS
        value: https://fluxpay-monad.netlify.app
      # Render prompts for these on first deploy (sync: false = never stored in git):
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PIMLICO_API_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
