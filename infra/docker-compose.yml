services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluxpay
      POSTGRES_PASSWORD: fluxpay
      POSTGRES_DB: fluxpay
    ports:
      - "5432:5432"
    volumes:
      - fluxpay_pg:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fluxpay_pg:
